<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Tactical Client</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            color: #4caf50;
            letter-spacing: 1px;
        }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #aaa;
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input, select, button {
            font-size: 16px;
            padding: 12px;
            margin: 4px 0;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #4caf50;
        }
        .cards-row {
            display: flex;
            gap: 10px;
        }
        .cards-row input {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-connect {
            background: #0288d1;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-send {
            background: #2e7d32;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.4);
        }
        .btn-send:active {
            transform: scale(0.98);
        }
        #status-box {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            padding: 18px;
            border-radius: 10px;
            background: #252525;
            border: 2px solid #333;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            transition: all 0.3s ease;
        }
        .hint {
            font-size: 11px;
            color: #777;
            text-align: left;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 ШТАБ | КЛИЕНТ</h2>

    <!-- Настройка подключения -->
    <label>IP-адрес сервера (ноутбука):</label>
    <input type="text" id="server_ip" value="127.0.0.1" placeholder="например, 192.168.1.5">
    <button class="btn-connect" onclick="connectWS()">🔌 Подключиться</button>

    <hr style="border-color: #2a2a2a; margin: 18px 0 10px 0;">

    <!-- Выбор слота игрока -->
    <label>Твой номер в команде:</label>
    <select id="player_id" onchange="onPlayerChange()">
        <option value="P1">Напарник 1 (P1)</option>
        <option value="P2" selected>Напарник 2 (P2)</option>
        <option value="P3">Напарник 3 (P3)</option>
        <option value="P4">Напарник 4 (P4)</option>
        <option value="P5">Напарник 5 (P5)</option>
        <option value="P6">Напарник 6 (P6)</option>
    </select>

    <!-- Ввод карт -->
    <label>Твои карты:</label>
    <div class="cards-row">
        <input type="text" id="card1" placeholder="Ah" maxlength="3" autocomplete="off" spellcheck="false">
        <input type="text" id="card2" placeholder="Kd" maxlength="3" autocomplete="off" spellcheck="false">
    </div>
    <div class="hint">Пример карт: Ah (Туз червей), Ks (Король пик), 10d (Десятка бубен), 2c (Двойка треф)</div>

    <button class="btn-send" onclick="sendCards()">⚡ ОТПРАВИТЬ КАРТЫ</button>

    <!-- Окно приказа -->
    <div id="status-box">Ожидание подключения...</div>
</div>

<script>
    let ws = null;

    function connectWS() {
        const ip = document.getElementById('server_ip').value.trim() || '127.0.0.1';
        const box = document.getElementById('status-box');

        if (ws) {
            ws.close();
        }

        box.innerText = 'Соединение...';
        box.style.borderColor = '#e65100';
        box.style.background = '#252525';

        try {
            ws = new WebSocket('ws://' + ip + ':8765');

            ws.onopen = () => {
                registerPlayer();
                box.innerText = '✅ Подключено к штабу!';
                box.style.borderColor = '#2e7d32';
                box.style.background = '#1b3a1e';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.action === 'role_assignment') {
                    box.innerText = data.command;
                    if(data.command.includes('АГРЕССОР')) {
                        box.style.background = '#b71c1c';
                        box.style.borderColor = '#ff1744';
                    } else if(data.command.includes('ЩИТ')) {
                        box.style.background = '#0d47a1';
                        box.style.borderColor = '#29b6f6';
                    } else {
                        box.style.background = '#333333';
                        box.style.borderColor = '#777777';
                    }
                }
            };

            ws.onerror = () => {
                box.innerText = '❌ Ошибка подключения';
                box.style.borderColor = '#c62828';
                box.style.background = '#3a1b1b';
            };

            ws.onclose = () => {
                box.innerText = '⚠️ Связь потеряна';
                box.style.borderColor = '#f57f17';
                box.style.background = '#252525';
            };
        } catch(e) {
            box.innerText = '❌ Неверный IP адрес';
            box.style.borderColor = '#c62828';
        }
    }

    function registerPlayer() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            const pid = document.getElementById('player_id').value;
            ws.send(JSON.stringify({action: 'register', player_id: pid}));
        }
    }

    function onPlayerChange() {
        registerPlayer();
    }

    function sendCards() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('Сначала нажми "Подключиться"!');
            return;
        }

        const pid = document.getElementById('player_id').value;
        let c1 = document.getElementById('card1').value.trim();
        let c2 = document.getElementById('card2').value.trim();

        if (!c1 || !c2) {
            alert('Введи обе карты!');
            return;
        }

        ws.send(JSON.stringify({
            action: 'send_cards',
            player_id: pid,
            card1: c1,
            card2: c2
        }));

        const box = document.getElementById('status-box');
        box.innerText = '🚀 Карты отправлены в штаб!';
        box.style.borderColor = '#4caf50';
    }
</script>

</body>
</html>
